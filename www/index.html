<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1c1e21">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Command">
  <title>Command</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <b>Command</b>
      <small id="syncLabel">On this phone</small>
    </div>
    <button type="button" class="btn" id="setupBtn" data-act="setup">Setup</button>
  </header>
  <main id="view"><p class="sub">Loading Command...</p></main>
  <nav class="tabbar" aria-label="Main">
    <button type="button" class="tab active" data-act="tab" data-tab="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 11 L12 4 L20 11 V20 H4 Z"/><path d="M10 20 V14 H14 V20"/></svg>
      <span>Home</span>
    </button>
    <button type="button" class="tab" data-act="tab" data-tab="decisions">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M8 12.5 L11 15.5 L16 9"/></svg>
      <span>Decisions</span>
    </button>
    <button type="button" class="tab" data-act="tab" data-tab="maps">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="6" cy="12" r="2.2"/><circle cx="16" cy="7" r="2.2"/><circle cx="16" cy="17" r="2.2"/><path d="M8 12 H14 M8.4 11 L14.2 7.6 M8.4 13 L14.2 16.4"/></svg>
      <span>Maps</span>
    </button>
    <button type="button" class="tab" data-act="tab" data-tab="thoughts">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 4 H14 L18 8 V20 H6 Z"/><path d="M14 4 V8 H18"/><path d="M8 12 H15 M8 16 H13"/></svg>
      <span>Thoughts</span>
    </button>
  </nav>
  <div id="toast" class="toast hidden" role="status"></div>
  <script src="js/xmind.js"></script>
  <script src="js/homefeed.js"></script>
  <script src="js/store.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
